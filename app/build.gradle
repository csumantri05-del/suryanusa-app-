plugins {
    id 'com.android.application'
}

android {
    namespace 'id.suryanusa.kalkulator'
    compileSdk 34

    defaultConfig {
        applicationId "id.suryanusa.kalkulator"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Untuk rilis Play Store, tambahkan signingConfig dengan keystore Anda sendiri.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
