name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SuryaNusa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SuryaNusa-apk
          path: SuryaNusa.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SuryaNusa v1.0.${{ github.run_number }}
          body: Unduh SuryaNusa.apk di bawah lalu pasang di HP Android (Android 8 ke atas).
          files: SuryaNusa.apk
